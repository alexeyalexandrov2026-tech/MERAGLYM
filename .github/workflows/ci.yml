name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  web:
    name: Web (Next.js) - lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # Electron is only needed by the desktop workflow.
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Generate Prisma clients (Postgres + SQLite)
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Build (web target)
        run: npm run build

  docker:
    name: Web Docker image - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t meraglym-web:ci .

  python:
    name: Python (intelligence layer) - tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q
