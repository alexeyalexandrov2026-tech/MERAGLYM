version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: meraglym-db
    environment:
      POSTGRES_USER: meraglym
      POSTGRES_PASSWORD: meraglym_password
      POSTGRES_DB: meraglym_osint
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meraglym -d meraglym_osint"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meraglym-web
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://meraglym:meraglym_password@db:5432/meraglym_osint?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
